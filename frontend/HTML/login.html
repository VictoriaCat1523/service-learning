<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>WITH us</title>
        <link rel="stylesheet" href="../css/login.css">
    </head>


    <body class="wrapper">
        <div>
            <header>
                <div class="logo_block">
                    <img src="../images/main_icon_project.svg" alt="" class="bebebe">
                    <span class="logo">WITH</span>  
                </div>
                
                <nav>
                    <ul>
                        <li><a href="main_site_before_autoriz.html">Главная</a></li>
                        <li><a href="#">Найти компанию</a></li>
                        <li><a href="#">Создать заявку</a></li>
                        <li><a href="#">Мои заявки</a></li>
                        <li><a href="#">Уведомления</a></li>
                    </ul>
                </nav>
                <div class="header_btns">
                        <a href="login.html" class="btn btn-entrance">Войти</a>
                        <a href="register.html" class="btn btn-register">Регистрация</a>
                </div>
            </header>
        </div>

        <div class="auth-container">
            <div class="auth-box">

                <div class="auth-toggle">
                    <button class="toggle-btn active" type="button" id="loginTab">Войти</button>
                    <button class="toggle-btn" type="button" id="registerTab">Регистрация</button>
                </div>

                
                <form class="auth-form">
                
                    <label>Email</label>
                    <input type="email">

                    <label>Пароль</label>
                    <input type="password">

                    <button type="submit">Войти</button>
                </form>
            </div>
        </div>

    </body>
</html>


<script>
    const loginTab = document.getElementById('loginTab');
    const registerTab = document.getElementById('registerTab');

    loginTab.addEventListener('click', function () {
        window.location.href = 'login.html';
    });

    registerTab.addEventListener('click', function () {
        window.location.href = 'register.html';
    });
</script>
