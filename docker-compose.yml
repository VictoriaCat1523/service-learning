services:
  # 1. База данных PostgreSQL
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: devops_user
      POSTGRES_PASSWORD: local_password_123
      POSTGRES_DB: auth_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops_user -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Бэкенд на Python (FastAPI)
  backend:
    build:
      context: ./backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://devops_user:local_password_123@db:5432/auth_db
    depends_on:
      db:
        condition: service_healthy

  # 3. Веб-сервер Nginx (Фронтенд и роутинг)
  webserver:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
